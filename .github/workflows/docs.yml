name: Docs

# Builds the DocFX site (API reference and guides) and publishes it to GitHub Pages on every
# push to main. DocFX is pinned in src/.config/dotnet-tools.json.
# Repository Settings -> Pages -> Source must be "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocFX site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      - name: Install DocFX
        working-directory: src
        run: dotnet tool restore

      # DocFX restores and compiles the documented projects itself to read the XML comments.
      # --warningsAsErrors: a broken link or cross reference fails the build.
      - name: Build site
        working-directory: src
        run: dotnet docfx docfx/docfx.json --warningsAsErrors

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/docfx/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
